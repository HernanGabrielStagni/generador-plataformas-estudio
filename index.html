<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Universal de Plataformas de Estudio</title>
  <style>
    :root {
      --bg: #1e293b;
      --panel: #f8fafc;
      --primary: #334155;
      --primary-deep: #0f172a;
      --accent: #6366f1;
      --accent-dark: #4338ca;
      --accent-soft: #e0e7ff;
      --border: #cbd5e1;
      --ink: #1e293b;
      --muted: #64748b;
      --ok: #16a34a;
      --warn-bg: #fefce8;
      --warn-border: #eab308;
      --warn-ink: #854d0e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px;
      color: var(--ink);
    }
    .header { text-align: center; color: #f1f5f9; margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; color: #a5b4fc; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; opacity: 0.65; font-family: sans-serif; }

    .resume-banner {
      background: var(--accent-soft); border: 1.5px solid var(--accent);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 14px;
      font-family: sans-serif; font-size: 0.85rem; color: var(--accent-dark);
      display: flex; align-items: center; gap: 12px; max-width: 760px; width: 100%;
    }
    .resume-banner button {
      background: none; border: 1.5px solid var(--accent-dark); color: var(--accent-dark);
      border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.78rem;
      font-family: sans-serif; white-space: nowrap;
    }

    .wizard {
      background: var(--panel); border-radius: 18px;
      width: 100%; max-width: 760px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }
    .progress { background: var(--primary); padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
    .step-dots { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
    .dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; color: white; font-family: sans-serif;
      font-weight: bold; cursor: default; transition: all 0.2s; flex-shrink: 0;
    }
    .dot.active { background: var(--accent); color: white; }
    .dot.done { background: rgba(255,255,255,0.45); cursor: pointer; }
    .prog-label { color: #f1f5f9; font-family: sans-serif; font-size: 0.78rem; white-space: nowrap; }

    .content { padding: 28px 28px 20px; }
    .step-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .step-num {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--primary-deep); color: #a5b4fc;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: bold; font-family: sans-serif;
      flex-shrink: 0; margin-top: 2px;
    }
    .step-head h2 { font-size: 1.2rem; color: var(--ink); line-height: 1.3; margin-bottom: 3px; }
    .step-sub { font-size: 0.8rem; color: var(--accent-dark); font-family: sans-serif; font-style: italic; }

    p.inst { font-family: sans-serif; font-size: 0.9rem; color: #444; line-height: 1.6; margin-bottom: 14px; }

    label.fld {
      display: block; font-family: sans-serif; font-size: 0.78rem; font-weight: 600;
      color: var(--primary); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .05em;
    }
    label.fld .opt { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
    input.txt, textarea.txt {
      width: 100%; box-sizing: border-box; padding: 10px 14px;
      border: 2px solid var(--border); border-radius: 8px;
      font-family: sans-serif; font-size: 0.88rem; background: #fff; color: var(--ink); outline: none;
    }
    input.txt:focus, textarea.txt:focus { border-color: var(--accent); }
    input.txt.mono { font-family: monospace; font-size: 0.82rem; }
    .hint { margin-top: 5px; font-family: sans-serif; font-size: 0.76rem; color: #94a3b8; line-height: 1.5; }
    .hint strong { color: var(--accent-dark); }

    .cards { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .card {
      border: 2px solid var(--border); border-radius: 10px;
      padding: 9px 14px; cursor: pointer; background: #fff;
      font-family: sans-serif; font-size: 0.85rem; color: var(--ink);
      transition: all 0.12s; user-select: none;
    }
    .card:hover { border-color: var(--accent); }
    .card.sel { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; color: var(--accent-dark); }

    .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .style-card {
      border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px;
      cursor: pointer; background: #fff; transition: all 0.12s;
    }
    .style-card:hover { border-color: var(--accent); }
    .style-card.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
    .style-card h5 { font-family: sans-serif; font-size: 0.88rem; color: var(--ink); margin-bottom: 6px; }
    .swatches { display: flex; gap: 4px; margin-bottom: 7px; }
    .sw { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.15); }
    .style-card p { font-family: sans-serif; font-size: 0.73rem; color: var(--muted); line-height: 1.45; }

    .mat-block {
      border: 1.5px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; background: #fff;
    }
    .mat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .mat-head h4 { font-family: sans-serif; font-size: 0.92rem; color: var(--ink); }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button {
      width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--accent);
      background: #fff; color: var(--accent-dark); font-size: 1.05rem; font-weight: bold;
      cursor: pointer; font-family: sans-serif; line-height: 1;
    }
    .stepper button:disabled { opacity: 0.3; cursor: default; }
    .stepper .qty {
      min-width: 30px; text-align: center; font-family: sans-serif;
      font-size: 1.05rem; font-weight: bold; color: var(--ink);
    }
    .obj-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
    .obj-row .tag {
      background: var(--primary-deep); color: #a5b4fc; font-family: monospace;
      font-size: 0.72rem; padding: 3px 8px; border-radius: 5px; white-space: nowrap; flex-shrink: 0;
    }
    .obj-row input.txt { flex: 1; min-width: 160px; padding: 7px 11px; font-size: 0.82rem; }
    .obj-row input.txt:disabled { background: #f1f5f9; color: #94a3b8; }
    .ia-chk {
      display: flex; align-items: center; gap: 5px; font-family: sans-serif;
      font-size: 0.76rem; color: var(--accent-dark); cursor: pointer; white-space: nowrap; user-select: none;
    }
    .ia-chk input { accent-color: var(--accent); cursor: pointer; }

    .tog-row {
      display: flex; align-items: center; gap: 8px; font-family: sans-serif;
      font-size: 0.87rem; color: var(--ink); padding: 7px 0; cursor: pointer; user-select: none;
    }
    .tog-row input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

    ul.ck { list-style: none; margin-bottom: 14px; }
    ul.ck li {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid #e2e8f0;
      font-family: sans-serif; font-size: 0.87rem; color: #333;
      cursor: pointer; line-height: 1.4;
    }
    ul.ck li:last-child { border-bottom: none; }
    .cb {
      width: 20px; height: 20px; border: 2px solid var(--accent);
      border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px; transition: all 0.15s;
    }
    ul.ck li.chk .cb { background: var(--accent); border-color: var(--accent); }
    ul.ck li.chk .cb::after { content: '✓'; color: white; font-size: 11px; }
    ul.ck li.chk .cl { text-decoration: line-through; color: #aaa; }
    .badge {
      display: inline-block; background: var(--primary-deep); color: #a5b4fc;
      font-family: monospace; font-size: 0.74rem;
      padding: 2px 7px; border-radius: 4px; margin: 0 2px;
    }
    .ck-counter {
      font-family: sans-serif; font-size: 0.78rem; color: var(--accent-dark);
      font-weight: 600; margin: -6px 0 14px; text-align: right;
    }
    .ck-counter.done { color: var(--ok); }

    .pbox {
      background: var(--primary-deep); border-radius: 10px;
      padding: 14px 14px 14px 16px; margin-bottom: 12px; position: relative;
    }
    .pbox pre {
      color: #e2e8f0; font-family: monospace; font-size: 0.76rem;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      max-height: 300px; overflow-y: auto; padding-right: 60px;
    }
    .cpbtn {
      position: absolute; top: 10px; right: 10px;
      background: var(--accent); color: white;
      border: none; border-radius: 6px; padding: 5px 12px;
      font-size: 0.78rem; font-weight: bold; cursor: pointer; font-family: sans-serif;
    }
    .cpbtn:hover { background: var(--accent-dark); }
    .cpbtn.ok { background: var(--ok); }

    .hl {
      background: white; border: 1.5px solid var(--accent);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
    }
    .hl h4 {
      font-family: sans-serif; font-size: 0.73rem;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--accent-dark); margin-bottom: 7px;
    }
    .hl p, .hl ul, .hl ol {
      font-family: sans-serif; font-size: 0.86rem; color: #555; line-height: 1.7;
    }
    .hl ul, .hl ol { padding-left: 18px; }
    .hl code { background: #eef2ff; padding: 1px 5px; border-radius: 3px; font-size: 0.8rem; }

    .warn {
      background: var(--warn-bg); border: 2px solid var(--warn-border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
      font-family: sans-serif; font-size: 0.86rem; color: var(--warn-ink); line-height: 1.5;
    }
    .warn strong { display: block; margin-bottom: 3px; }
    .warn code { background: #fef9c3; padding: 1px 5px; border-radius: 3px; font-size: 0.8rem; }
    .warn ul { margin: 8px 0 0 18px; line-height: 1.6; }

    .ftree {
      background: var(--primary-deep); border-radius: 10px;
      padding: 14px 18px; margin-bottom: 14px; overflow-x: auto;
    }
    .ftree pre { color: #e2e8f0; font-family: monospace; font-size: 0.78rem; line-height: 1.65; }
    .gold { color: #a5b4fc; }

    .darkbox { background: var(--primary-deep); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .darkbox .db-title {
      color: #a5b4fc; font-family: sans-serif; font-size: 0.8rem; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }
    .darkbox p { color: #e2e8f0; font-family: sans-serif; font-size: 0.87rem; line-height: 1.6; margin-bottom: 10px; }
    .darkbox p:last-child { margin-bottom: 0; }
    .darkbox .pill-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .darkbox .pill {
      background: var(--accent); color: white; font-family: sans-serif; font-size: 0.76rem;
      font-weight: bold; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
    }
    .darkbox .mono { color: #e2e8f0; font-family: monospace; font-size: 0.8rem; }

    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
    .btn-back {
      background: none; border: 2px solid #bbb; color: #777;
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      font-family: sans-serif; font-size: 0.88rem;
    }
    .btn-next {
      background: var(--primary-deep); border: none; color: #a5b4fc;
      padding: 12px 24px; border-radius: 8px; cursor: pointer;
      font-family: sans-serif; font-size: 0.92rem; font-weight: bold;
      flex: 1; max-width: 290px;
    }
    .btn-next:hover { background: var(--primary); }
    .btn-next:disabled { background: #ccc; color: #888; cursor: not-allowed; }
    .btn-next:disabled:hover { background: #ccc; }

    .step-pdf {
      background: white; border: 2px solid var(--accent);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
    }
    .step-pdf h4 {
      font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 1px; color: var(--accent-dark); margin-bottom: 10px;
    }
    .step-pdf ol {
      font-family: sans-serif; font-size: 0.9rem; color: #333;
      line-height: 1.8; padding-left: 20px;
    }
    .step-pdf .nombre-archivo {
      display: inline-block; margin-top: 10px;
      background: var(--primary-deep); color: #a5b4fc;
      font-family: monospace; font-size: 0.85rem;
      padding: 5px 14px; border-radius: 6px;
    }
    .greenbox {
      background: #eef2ff; border: 2px solid var(--accent); border-radius: 10px;
      padding: 14px 18px; margin-bottom: 18px; font-family: sans-serif;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📚 Generador Universal de Plataformas de Estudio</h1>
  <p>De cualquier PDF a una plataforma web de estudio · con NotebookLM + Claude Code</p>
</div>

<div id="resumeSlot"></div>

<div class="wizard">
  <div class="progress">
    <div class="step-dots" id="dots"></div>
    <div class="prog-label" id="progLbl"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ═══════════════════════════════ ESTADO ═══════════════════════════════
const LS_KEY = 'genUniversal_v1';
const TOTAL = 9;

function defaultState() {
  return {
    step: 0,
    proyecto: { titulo:'', marca:'', logoFile:'', slug:'', slugTouched:false, carpeta:'', githubUser:'HernanGabrielStagni' },
    perfil: { audiencia:'publico', audienciaOtro:'', nivel:'basico', tipoTexto:'manual', tipoTextoOtro:'' },
    estetica: { estiloId:'minimalista', estiloImagenId:'', custom: { colores:['#1f2937','#374151','#d97706','#f9fafb'], descripcion:'', tipografia:'' } },
    materiales: {
      videos:         [ {objetivo:'', ia:true}, {objetivo:'', ia:true}, {objetivo:'', ia:true} ],
      infografias:    [ {objetivo:'', ia:true}, {objetivo:'', ia:true}, {objetivo:'', ia:true} ],
      presentaciones: [ {objetivo:'', ia:true}, {objetivo:'', ia:true} ],
      audios:         [ {objetivo:'', ia:true} ],
      resumenDetallado: true,
      resumenCondensado: false,
      guiaDividida: false,
      quiz: { incluir:true, cantidad:10 }
    },
    modeloPath: '',
    checks: {}
  };
}

let state = defaultState();
let resumedFromStorage = false;
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    const saved = JSON.parse(raw);
    state = { ...defaultState(), ...saved,
      proyecto: { ...defaultState().proyecto, ...(saved.proyecto||{}) },
      perfil: { ...defaultState().perfil, ...(saved.perfil||{}) },
      estetica: { ...defaultState().estetica, ...(saved.estetica||{}),
                  custom: { ...defaultState().estetica.custom, ...((saved.estetica||{}).custom||{}) } },
      materiales: { ...defaultState().materiales, ...(saved.materiales||{}),
                    quiz: { ...defaultState().materiales.quiz, ...((saved.materiales||{}).quiz||{}) } },
      checks: saved.checks || {}
    };
    if (state.step > 0) resumedFromStorage = true;
  }
} catch(e) {}

function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {} }

function restart() {
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
  state = defaultState();
  resumedFromStorage = false;
  document.getElementById('resumeSlot').innerHTML = '';
  render();
  window.scrollTo({ top: 0 });
}

// ═══════════════════════════════ HELPERS ═══════════════════════════════
function slugify(t) {
  return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0, 40);
}
function estiloActivo() {
  if (state.estetica.estiloId === 'custom') {
    const c = state.estetica.custom;
    return { nombre: 'Personalizado', colores: c.colores,
             descripcion: c.descripcion || 'Estilo definido por el usuario',
             tipografia: c.tipografia || 'A criterio del diseñador' };
  }
  return ESTILOS[state.estetica.estiloId];
}
function opcionesEstiloImagen() { return ESTILO_IMAGEN_POR_TIPO[tipoKey()] || ESTILO_IMAGEN_POR_TIPO.otro; }
function estiloImagenActivo() {
  const ops = opcionesEstiloImagen();
  return ops.find(o => o.id === state.estetica.estiloImagenId) || ops[0];
}
function audLabel() { return state.perfil.audiencia === 'otro' ? (state.perfil.audienciaOtro || 'otro público') : AUDIENCIAS[state.perfil.audiencia]; }
function tipoLabel() { return state.perfil.tipoTexto === 'otro' ? (state.perfil.tipoTextoOtro || 'otro tipo de texto') : TIPOS[state.perfil.tipoTexto]; }
function tipoKey() { return state.perfil.tipoTexto === 'otro' ? 'otro' : state.perfil.tipoTexto; }
function cants() {
  const m = state.materiales;
  return { v: m.videos.length, i: m.infografias.length, p: m.presentaciones.length, a: m.audios.length };
}
function totalHerr() { const c = cants(); return c.v + c.i + c.p + c.a + (state.materiales.guiaDividida ? 2 : 1); }
function objTxt(item, generico) { return item.ia ? generico : ('"' + item.objetivo.trim() + '"'); }
function esc(s) { return s.replace(/</g,'&lt;'); }

// Setters (llamados desde oninput/onclick de los pasos)
function setProy(k, val) {
  state.proyecto[k] = val;
  if (k === 'titulo' && !state.proyecto.slugTouched) {
    state.proyecto.slug = slugify(val);
    const s = document.getElementById('f-slug');
    if (s) s.value = state.proyecto.slug;
  }
  if (k === 'slug') state.proyecto.slugTouched = true;
  save();
}
function pick(sec, k, val) { state[sec][k] = val; save(); render(); }
function setPerfil(k, val) { state.perfil[k] = val; save(); }
function pickEstilo(id) { state.estetica.estiloId = id; save(); render(); }
function pickEstiloImagen(id) { state.estetica.estiloImagenId = id; save(); render(); }
function setCustom(i, val) { state.estetica.custom.colores[i] = val; save(); }
function setCustomTxt(k, val) { state.estetica.custom[k] = val; save(); }
function cant(tipo, delta) {
  const arr = state.materiales[tipo];
  const max = tipo === 'audios' ? 3 : 5;
  const n = arr.length + delta;
  if (n < 0 || n > max) return;
  if (delta > 0) arr.push({objetivo:'', ia:true});
  else arr.pop();
  save(); render();
}
function setObj(tipo, i, val) { state.materiales[tipo][i].objetivo = val; save(); }
function iaTog(tipo, i, checked) { state.materiales[tipo][i].ia = checked; save(); render(); }
function setMat(k, val) { state.materiales[k] = val; save(); render(); }
function quizTog(val) { state.materiales.quiz.incluir = val; save(); render(); }
function quizCant(delta) {
  const q = state.materiales.quiz;
  const n = q.cantidad + delta;
  if (n < 5 || n > 20) return;
  q.cantidad = n; save(); render();
}
function setModelo(val) { state.modeloPath = val.trim().replace(/[\\/]+$/, ''); save(); }

// ═══════════════════════════════ CHECKLIST + NAV (portado del wizard original) ═══════════════════════════════
function cp(text, id) {
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById(id);
    const orig = b.textContent;
    b.textContent = '✓ Copiado'; b.classList.add('ok');
    setTimeout(() => { b.textContent = orig; b.classList.remove('ok'); }, 2200);
  });
}
function tog(el) {
  el.classList.toggle('chk');
  const key = el.dataset.key;
  if (key) { state.checks[key] = el.classList.contains('chk'); save(); }
  updateNavState();
}
function ckLi(key, html) {
  const on = state.checks[key] ? ' chk' : '';
  return `<li data-key="${key}" onclick="tog(this)" class="${on}"><div class="cb"></div><span class="cl">${html}</span></li>`;
}
function updateNavState() {
  const btn = document.getElementById('btnNext');
  const counter = document.getElementById('ckCounter');
  if (!btn) return;
  const items = document.querySelectorAll('#content ul.ck li');
  if (items.length === 0) {
    btn.disabled = false;
    if (counter) counter.style.display = 'none';
    return;
  }
  const total = items.length;
  const checked = document.querySelectorAll('#content ul.ck li.chk').length;
  btn.disabled = checked < total;
  if (counter) {
    counter.style.display = '';
    counter.textContent = checked < total
      ? `☐ Marcá los ítems para continuar (${checked}/${total})`
      : `✓ Todo listo (${total}/${total})`;
    counter.classList.toggle('done', checked >= total);
  }
}
function nav(label) {
  return `<div class="ck-counter" id="ckCounter" style="display:none"></div>
  <div class="nav">
    ${state.step > 0 ? `<button class="btn-back" onclick="go(-1)">← Atrás</button>` : '<div></div>'}
    <button class="btn-next" id="btnNext" onclick="go(1)">${label || 'Siguiente →'}</button>
  </div>`;
}
function go(d) {
  if (d === 1) {
    const btn = document.getElementById('btnNext');
    if (btn && btn.disabled) return;
    if (!validar(state.step)) return;
  }
  state.step = Math.max(0, Math.min(TOTAL - 1, state.step + d));
  save();
  render();
  window.scrollTo({ top: 0 });
}
function validar(paso) {
  if (paso === 0) {
    const p = state.proyecto;
    if (!p.titulo.trim()) { alert('Ingresá el título del curso o libro.'); return false; }
    if (!p.marca.trim()) { alert('Ingresá el nombre de tu empresa o marca.'); return false; }
    if (!p.slug.trim()) { alert('El identificador corto no puede quedar vacío.'); return false; }
    if (!p.carpeta.trim()) { alert('Pegá la ruta de la carpeta del proyecto.'); return false; }
    p.slug = slugify(p.slug);
    p.carpeta = p.carpeta.trim().replace(/[\\/]+$/, '') + '\\';
    if (!p.githubUser.trim()) p.githubUser = 'HernanGabrielStagni';
    save();
  }
  if (paso === 1) {
    if (state.perfil.audiencia === 'otro' && !state.perfil.audienciaOtro.trim()) { alert('Describí a quién va dirigida la plataforma.'); return false; }
    if (state.perfil.tipoTexto === 'otro' && !state.perfil.tipoTextoOtro.trim()) { alert('Describí qué tipo de texto es.'); return false; }
  }
  if (paso === 2) {
    if (state.estetica.estiloId === 'custom' && !state.estetica.custom.descripcion.trim()) {
      alert('Describí el estilo visual personalizado (como se lo dirías a un ilustrador).'); return false;
    }
  }
  if (paso === 3) {
    const c = cants();
    if (c.v + c.i + c.p + c.a === 0 && !state.materiales.resumenDetallado && !state.materiales.resumenCondensado) {
      alert('Elegí al menos un material para generar.'); return false;
    }
    for (const [tipo, nombre] of [['videos','video'],['infografias','infografía'],['presentaciones','presentación'],['audios','audio']]) {
      for (let k = 0; k < state.materiales[tipo].length; k++) {
        const it = state.materiales[tipo][k];
        if (!it.ia && !it.objetivo.trim()) {
          alert(`Al ${nombre} ${k+1} le falta el objetivo: escribilo o tildá "Que lo decida la IA".`); return false;
        }
      }
    }
  }
  return true;
}

// ═══════════════════════════════ GENERADORES ═══════════════════════════════
const LIMITE_MAESTRO = 3700; // empírico: NotebookLM acepta hasta ~3750 caracteres; se deja margen de seguridad

function maestroPiezas() {
  const p = state.proyecto, tk = tipoKey(), c = cants(), m = state.materiales;
  const est = estiloActivo();
  const herrDesc = [];
  if (c.v) herrDesc.push(`${c.v} video${c.v>1?'s':''}`);
  if (c.i) herrDesc.push(`${c.i} infografía${c.i>1?'s':''}`);
  if (c.p) herrDesc.push(`${c.p} ${c.p>1?'presentaciones':'presentación'}`);
  if (c.a) herrDesc.push(`${c.a} audio${c.a>1?'s':''}`);
  herrDesc.push(m.guiaDividida ? '2 informes' : '1 informe');

  const intro = `Actuá como ${ROL[tk]} creando material de estudio a partir del texto "${p.titulo}" para la marca ${p.marca}.
Procesá el texto de forma exhaustiva siguiendo su jerarquía interna real.

AUDIENCIA: ${audLabel()}. Nivel previo: ${NIVELES[state.perfil.nivel]}.
${TONO_NIVEL[state.perfil.nivel]}
${TONO_TIPO[tk]}`;

  const ejecucion = `EJECUTA MANUALMENTE E INMEDIATAMENTE, en este mismo turno y de forma
asincrónica, las ${totalHerr()} herramientas de creación de artefactos
(${herrDesc.join(', ')}). No esperes mi confirmación:
activá los llamados a las herramientas ya, para que empiecen a
procesarse en el Panel de Studio de inmediato.`;

  let f0 = `FASE 0 — DATOS ESTRUCTURADOS PARA CÓDIGO DE PLATAFORMA
Genera exactamente en este formato sin alterarlo:

INICIO:
titulo: "${p.titulo}"
subtitulo: "..."
descripcion: "..." (2-3 oraciones)
conceptos_clave: ["...", "...", "...", "...", "..."]`;

  const bloque = (tipo, pref, arr, generico) => {
    let out = '';
    arr.forEach((it, k) => {
      const n = k + 1;
      out += `\n\n${pref}_${n} ${it.ia ? '(proponé vos el enfoque según la jerarquía del texto)' : `(enfoque pedido: "${it.objetivo.trim()}")`}:
${pref}_${n}_titulo: "..."
${pref}_${n}_subtitulo: "..."
${pref}_${n}_descripcion: "..."
${pref}_${n}_conceptos: ["...", "...", "...", "..."]`;
    });
    return out;
  };
  if (c.v) f0 += '\n\nVIDEOS — agrupá el contenido en ' + c.v + ' bloque' + (c.v>1?'s':'') + ' temático' + (c.v>1?'s':'') + ':' + bloque('videos','video',m.videos);
  if (c.i) f0 += '\n\nINFOGRAFÍAS:' + bloque('infografias','infografia',m.infografias);
  if (c.p) f0 += '\n\nPRESENTACIONES:' + bloque('presentaciones','presentacion',m.presentaciones);
  if (c.a) f0 += '\n\nAUDIOS:' + bloque('audios','audio',m.audios);
  if (m.guiaDividida) {
    f0 += `\n\nDOCUMENTOS:
doc_guia1_titulo: "Guía de Estudio Maestra · Parte 1/2 · ${p.titulo}"
doc_guia1_descripcion: "..."
doc_guia1_indicaciones: ["...", "...", "...", "..."]
doc_guia2_titulo: "Guía de Estudio Maestra · Parte 2/2 · ${p.titulo}"
doc_guia2_descripcion: "..."
doc_guia2_indicaciones: ["...", "...", "...", "..."]
doc_fuente_titulo: "Texto fuente original"
doc_fuente_descripcion: "..."
doc_fuente_indicaciones: ["...", "...", "...", "..."]`;
  } else {
    f0 += `\n\nDOCUMENTOS:
doc_1_titulo: "Guía de Estudio Maestra · ${p.titulo}"
doc_1_descripcion: "..."
doc_1_indicaciones: ["...", "...", "...", "..."]
doc_2_titulo: "Texto fuente original"
doc_2_descripcion: "..."
doc_2_indicaciones: ["...", "...", "...", "..."]`;
  }
  if (m.resumenDetallado) f0 += `\n\nRESUMEN_GENERAL (detallado):
intro: "..."
puntos_clave: ["...", "...", "...", "...", "...", "...", "..."]
frase_cierre: "..."`;
  if (m.resumenCondensado) f0 += `\n\nRESUMEN_CONDENSADO (súper condensado y pedagógico):
maximo 10 puntos, lenguaje llano, pensado para repaso final:
puntos: ["...", "...", "..."]
frase_final: "..."`;

  const f1 = `FASE 1 — ANÁLISIS JERÁRQUICO
Analizá cada sección o capítulo del texto e identificá su título y foco.
Para cada una extraé:
${ANALISIS_POR_TIPO[tk].map(x => '• ' + x).join('\n')}`;

  const estImg = estiloImagenActivo();
  let f2 = `FASE 2 — DISEÑO (INVIOLABLE, aplica a todos los entregables, incluidos los videos)
• Estilo visual: ${est.descripcion}
• Tipo de imagen/ilustración: ${estImg.nombre} — ${estImg.desc}
• Paleta EXACTA (usar estos códigos de color tal cual, no colores aproximados ni "parecidos"): ${est.colores.join(' · ')}
• Tipografía: ${est.tipografia}`;
  if (p.logoFile.trim()) f2 += `\n• Logo '${p.logoFile.trim()}': usalo EXACTAMENTE tal cual fue provisto como fuente —
  NO lo rediseñes, NO lo redibujes, NO le cambies colores, tipografía ni proporciones.
  Insertalo como imagen sin modificaciones, como sello discreto en la esquina inferior derecha.
  PROHIBIDO inventar versiones alternativas o ubicarlo en otro lugar.`;
  f2 += `\n• Texto calado directamente sobre la ilustración de fondo. PROHIBIDO todo recuadro,
  tarjeta o bloque de color sólido (blanco o de cualquier otro color) que tape el fondo —
  esta regla aplica también, y especialmente, a los videos: nada de paneles ni cajas de
  color plano cubriendo la imagen, el texto va integrado a la escena.
• Fondos: ilustración/composición continua en todo el entregable. PROHIBIDO pantallas
  lisas de un solo color con texto encima.`;

  const descCorta = est.descripcion.length > 180 ? est.descripcion.slice(0, 180) + '…' : est.descripcion;
  let f3 = `FASE 3 — ENTREGABLES (ejecutar las ${totalHerr()} herramientas ya, en paralelo)`;
  let idx = 0;
  if (c.v) {
    idx++;
    f3 += `\n\n${idx}) VIDEO (herramienta "Resumen en video") × ${c.v}:
  Formato: Explicación · Idioma: español (Latinoamérica)
  Duración: al menos 12 minutos cada uno (evitar resúmenes cortos de 5-7 minutos;
  desarrollá el contenido con más profundidad y ejemplos para llegar a esa duración)
  Estilo visual: Personalizado
  Descripción: "${descCorta} · ${p.titulo} · ${p.marca}"`;
    m.videos.forEach((it, k) => { f3 += `\n  Video ${k+1}: ${it.ia ? 'enfoque a tu criterio según la jerarquía del texto' : it.objetivo.trim()}`; });
  }
  if (c.i) {
    idx++;
    f3 += `\n\n${idx}) INFOGRAFÍA (herramienta "Infografía") × ${c.i}:
  Idioma: español · Vertical · Editorial · Detallado
  Descripción: "${descCorta} · ${p.marca}"`;
    m.infografias.forEach((it, k) => { f3 += `\n  Infografía ${k+1}: ${it.ia ? 'enfoque a tu criterio según la jerarquía del texto' : it.objetivo.trim()}`; });
  }
  if (c.p) {
    idx++;
    f3 += `\n\n${idx}) PRESENTACIÓN (herramienta "Presentación con...") × ${c.p}:
  Cada una: Presentación detallada · español (Latinoamérica)
  Descripción: "${descCorta} · ${p.marca}"`;
    const todasIA = m.presentaciones.every(x => x.ia);
    if (todasIA && c.p > 1) {
      f3 += `\n  Generá ${c.p} presentaciones separadas repartiendo el contenido del texto
  en partes iguales: Parte 1/${c.p} … Parte ${c.p}/${c.p} (continuación).`;
    } else {
      m.presentaciones.forEach((it, k) => { f3 += `\n  Presentación ${k+1}: ${it.ia ? 'enfoque a tu criterio según la jerarquía del texto' : it.objetivo.trim()}`; });
    }
  }
  if (c.a) {
    idx++;
    f3 += `\n\n${idx}) AUDIO (herramienta "Resumen en audio") × ${c.a}:
  Formato: Podcast conversado entre 2 (dos) voces, estilo diálogo — NO un narrador
  único leyendo un texto. Deben sonar como dos presentadores charlando entre sí,
  haciéndose preguntas y comentarios, con naturalidad.
  Tono: cálido, ameno y entusiasta — cercano y con energía positiva, no acartonado
  ni de lectura formal.
  Duración: 8-10 min cada uno.`;
    m.audios.forEach((it, k) => { f3 += `\n  Audio ${k+1}: ${it.ia ? 'enfoque a tu criterio según la jerarquía del texto' : it.objetivo.trim()}`; });
  }
  idx++;
  if (m.guiaDividida) {
    f3 += `\n\n${idx}) GUÍA (herramienta "Informes") × 2 — el texto es extenso, generá DOS
  informes separados en vez de uno solo:
  Parte 1/2: cubrí la PRIMERA MITAD de los capítulos/secciones del texto, de forma
  súper detallada y exhaustiva — desarrollo real de cada concepto con los puntos
  de la FASE 1, no una simple enumeración.
  Parte 2/2: cubrí la SEGUNDA MITAD de los capítulos/secciones restantes, con el
  mismo nivel de detalle y exhaustividad que la Parte 1.`;
  } else {
    f3 += `\n\n${idx}) GUÍA (herramienta "Informes"):
  Reporte / guía de estudio exhaustiva con los puntos de la FASE 1.`;
  }

  if (c.v + c.i + c.p > 0) {
    f3 += `\n\nIMPORTANTE — antes de terminar, escribime en el chat una lista clara indicando
el ORDEN y TÍTULO exacto de cada video, infografía y presentación que generaste,
en el mismo orden en que aparecen en el texto (por ejemplo: "Video 1: ...",
"Video 2: ...", "Infografía 1: ...", etc.). Necesito esa lista para poder
identificar qué archivo descargado corresponde a cuál — el orden en que los
generás en el Panel de Studio no siempre coincide con el orden real del texto.`;
  }

  let f4 = null;
  if (m.quiz.incluir) {
    const claveLinea = Array.from({length: m.quiz.cantidad}, (_, k) => `${k+1}:x`).join('  ');
    f4 = `FASE 4 — CUESTIONARIO
Creá ${m.quiz.cantidad} preguntas de opción múltiple (a/b/c/d, una sola correcta)
${FOCO_QUIZ[tk]}. Dificultad acorde a: ${NIVELES[state.perfil.nivel].toLowerCase()}.
Al final, en bloque separado y en una sola línea:
CLAVE: ${claveLinea}`;
  }

  const reglaOro = `REGLA DE ORO
Tono adaptado a la audiencia indicada. Sin referencias a material externo al texto.
El diseño debe respirar el estilo "${est.nombre}".`;

  return { intro, ejecucion, f0, f1, f2, f3, f4, reglaOro };
}

function buildMaestroUnico() {
  const z = maestroPiezas();
  return [z.intro, z.ejecucion, z.f0, z.f1, z.f2, z.f3, z.f4, z.reglaOro].filter(Boolean).join('\n\n');
}

// Bloques indivisibles, en el orden en que deben aparecer en el/los mensaje(s).
// "entregables" agrupa la orden de ejecución inmediata junto con la FASE 3,
// porque esa orden tiene que ir pegada justo antes del pedido de las herramientas.
function maestroBloques() {
  const z = maestroPiezas();
  const bloques = [
    { tag: 'intro', txt: z.intro },
    { tag: 'f0', txt: z.f0 },
    { tag: 'f1', txt: z.f1 },
    { tag: 'f2', txt: z.f2 },
    { tag: 'entregables', txt: [z.ejecucion, z.f3].join('\n\n') },
  ];
  if (z.f4) bloques.push({ tag: 'f4', txt: z.f4 });
  bloques.push({ tag: 'regla', txt: z.reglaOro });
  return bloques;
}

// Cada mensaje lleva además una nota de continuación ("PEDIDO K DE N...") que
// se agrega DESPUÉS de empaquetar — hay que reservarle presupuesto acá, si no
// el mensaje final puede terminar pasado el límite aunque el contenido solo no.
const MARGEN_NOTA = 450;

// Empaqueta los bloques en la menor cantidad de mensajes posible sin superar
// LIMITE_MAESTRO en ninguno, ya con margen para la nota (cada bloque es
// indivisible; si un bloque solo ya supera el límite, queda solo en su propio
// mensaje — caso raro).
function empaquetarMaestro() {
  const bloques = maestroBloques();
  const limiteEfectivo = LIMITE_MAESTRO - MARGEN_NOTA;
  const partes = [];
  let actual = [], actualTags = [], actualLen = 0;
  for (const b of bloques) {
    const addLen = b.txt.length + (actual.length ? 2 : 0);
    if (actual.length && actualLen + addLen > limiteEfectivo) {
      partes.push({ textos: actual, tags: actualTags });
      actual = [b.txt]; actualTags = [b.tag]; actualLen = b.txt.length;
    } else {
      actual.push(b.txt); actualTags.push(b.tag); actualLen += addLen;
    }
  }
  if (actual.length) partes.push({ textos: actual, tags: actualTags });
  return partes;
}

function necesitaSplit() { return empaquetarMaestro().length > 1; }

// Devuelve el texto final de cada mensaje a pegar en NotebookLM, ya con las
// notas de continuación ("PEDIDO K DE N") insertadas donde corresponde.
function mensajesMaestro() {
  const partes = empaquetarMaestro();
  const N = partes.length;
  if (N <= 1) return [buildMaestroUnico()];
  let entregablesYaPasado = false;
  return partes.map((p, i) => {
    const esEntregables = p.tags.includes('entregables');
    let texto;
    if (i === 0) {
      const [primero, ...resto] = p.textos;
      const nota = `Este es el PEDIDO 1 DE ${N} de este cuaderno (tu contenido es extenso, lo
dividimos en ${N} mensajes para que no se sature). Respondé SOLO lo que se pide
en este mensaje — NO actives ninguna herramienta de generación todavía, eso
va a llegar en un mensaje posterior, una vez que termines de responder esto
por completo.`;
      texto = [primero, nota, ...resto].join('\n\n');
    } else {
      let nota = `Seguimos con el mismo texto (PEDIDO ${i + 1} DE ${N} de este cuaderno,
continuación del pedido anterior).`;
      if (!esEntregables && !entregablesYaPasado) {
        nota += ' Seguí respondiendo solo texto y análisis — todavía no actives ninguna herramienta de generación.';
      }
      texto = [nota, ...p.textos].join('\n\n');
    }
    if (esEntregables) entregablesYaPasado = true;
    return texto;
  });
}

    m[tipo].forEach((it, k) => {

  // 5 — Prompt Maestro (único, o dividido en 2 mensajes si es muy largo)
  () => {
    const c = cants();
    if (!necesitaSplit()) {
      return `
    <div class="step-head">
      <div class="step-num">5</div>
      <div><h2>Prompt Maestro</h2><div class="step-sub">Este paso tiene dos partes: pegar el prompt, y después crear un PDF nuevo con lo que te responda NotebookLM</div></div>
    </div>

    <div class="pbox">
      <button class="cpbtn" id="cpM" onclick="cp(buildMaestroUnico(),'cpM')">Copiar</button>

    </div>
    <div class="hl">
      <h4>✅ ¿Qué debería pasar apenas lo pegues?</h4>
      <p>Con <strong>solo pegar este mensaje ya alcanza</strong> — no hace falta escribirle después "dale, generalo". En los próximos minutos deberías ver en el <strong>Panel de Studio</strong> tarjetas nuevas en estado "generando" para los ${totalHerr()} entregables. Si pasan varios minutos y el Panel sigue vacío, es señal de que no arrancó: volvé a pegar el mismo prompt una vez más.</p>
    </div>
    <div class="step-pdf">
      <h4>Parte 2 — Creá VOS un PDF nuevo con la respuesta de texto</h4>
      <p class="inst" style="margin-bottom:10px">Cuando pegaste el prompt, NotebookLM además de generar los videos/infografías/etc. te va a <strong>responder con texto</strong> en el chat (los datos de la Fase 0, el análisis, y el quiz). Ese texto <strong>no se guarda solo</strong> — vos tenés que convertirlo en un archivo PDF, siguiendo estos pasos:</p>
      ${pasosGuardarPdf(fasesPdfName())}
    </div>
    ${darkboxPrefijos(c)}
    <ul class="ck">
      ${ckLi('5-0', `Confirmo que ya vi actividad en el Panel de Studio (tarjetas en "generando") o que reintenté el prompt porque no arrancaba`)}
      ${ckLi('5-1', `Ya creé y guardé el PDF de la <strong>Parte 2</strong> con el nombre <span class="badge">${fasesPdfName()}</span>`)}
    </ul>
    ${nav()}
  `;
    }

    // ── Variante dividida: tu contenido genera un prompt demasiado largo ──
    const largoUnico = buildMaestroUnico().length;
    const partes = empaquetarMaestro();
    const mensajes = mensajesMaestro();
    const N = mensajes.length;
    const LETRA = (i) => String.fromCharCode(97 + i);
    const tituloParte = (tags) => {
      const t = [];
      if (tags.includes('intro') || tags.includes('f0') || tags.includes('f1')) t.push('análisis y datos');
      if (tags.includes('f2')) t.push('diseño');
      if (tags.includes('entregables')) t.push('entregables multimedia');
      if (tags.includes('f4')) t.push('quiz');
      if (tags.includes('regla')) t.push('cierre');
      const s = t.length ? t.join(' + ') : 'continuación';
      return s.charAt(0).toUpperCase() + s.slice(1);
    };

    let bloques = '';
    partes.forEach((p, i) => {
      const esEntregables = p.tags.includes('entregables');
      const nombreFase = faseNPdfName(i + 1);
      bloques += `
    <div class="step-head" style="margin-top:${i===0?'0':'22px'};margin-bottom:8px">
      <div class="step-num">5${LETRA(i)}</div>
      <div><h2 style="font-size:1.05rem">Mensaje ${i+1} de ${N} — ${tituloParte(p.tags)}</h2></div>
    </div>
    <p class="inst">${i===0 ? 'Copiá este prompt y pegalo <strong>completo, en un solo mensaje</strong> en el chat de NotebookLM.' : `En el <strong>mismo chat</strong> de NotebookLM (es continuación, ya tiene el contexto de ${i===1?'el mensaje anterior':'los mensajes anteriores'}), pegá este prompt:`}</p>
    <div class="pbox">
      <button class="cpbtn" id="cpM${i+1}" onclick="cp(mensajesMaestro()[${i}],'cpM${i+1}')">Copiar</button>
      <pre>${esc(mensajes[i])}</pre>
    </div>`;
      if (esEntregables) {
        bloques += `
    <div class="hl">
      <h4>✅ ¿Qué debería pasar apenas lo pegues?</h4>
      <p>Con <strong>solo pegar este mensaje ya alcanza</strong> — no hace falta escribirle después "dale, generalo". En los próximos minutos deberías ver en el <strong>Panel de Studio</strong> tarjetas nuevas en estado "generando" para los ${totalHerr()} entregables. Si pasan varios minutos y el Panel sigue vacío, es señal de que no arrancó: volvé a pegar este mismo mensaje una vez más.</p>
    </div>`;
      }
      bloques += `
    <div class="step-pdf">
      <h4>Guardá esta respuesta como PDF</h4>
      <p class="inst" style="margin-bottom:10px">Cuando NotebookLM termine de responder <strong>por completo</strong> (no a medias ni cortada), convertí esa respuesta de texto en un PDF:</p>
      ${pasosGuardarPdf(nombreFase)}
    </div>`;
      if (esEntregables) bloques += darkboxPrefijos(c);
      bloques += `
    <ul class="ck">
      ${esEntregables
        ? ckLi(`5-p${i+1}a`, `Confirmo que ya vi actividad en el Panel de Studio (tarjetas en "generando") o que reintenté este mensaje porque no arrancaba`) + ckLi(`5-p${i+1}b`, `Ya creé y guardé el PDF con el nombre <span class="badge">${nombreFase}</span>`)
        : ckLi(`5-p${i+1}`, `Confirmo que NotebookLM <strong>terminó de responder completo</strong> este mensaje y ya guardé el PDF <span class="badge">${nombreFase}</span>`)}
    </ul>`;
    });

    return `
    <div class="step-head">
      <div class="step-num">5</div>
      <div><h2>Prompt Maestro — dividido en ${N} mensajes</h2><div class="step-sub">Tu contenido es extenso: lo separamos para que NotebookLM no se trabe</div></div>
    </div>
    <div class="warn">
      <strong>🐢 Por qué esta vez son ${N} mensajes</strong>
      Con la cantidad de material que pediste, el prompt completo daría <strong>${largoUnico} caracteres</strong>. Comprobamos que NotebookLM deja de arrancar bien pasados los ~${LIMITE_MAESTRO} caracteres en un solo mensaje — por eso este wizard lo separó en ${N} partes que vas a pegar una después de la otra, <strong>en el mismo chat</strong>.
    </div>
    ${bloques}
    ${nav()}
  `;
  },

      <ul>
        <li>Lee <strong>${necesitaSplit() ? mensajesMaestro().map((_, i) => faseNPdfName(i+1)).join(', ') : fasesPdfName()}</strong> y extrae los textos${state.materiales.quiz.incluir ? ' y la clave del quiz' : ''}</li>
        ${state.modeloPath ? `<li>Lee el código del modelo de referencia (sin tocarlo) y lo replica adaptando marca y contenido</li>` : `<li>Diseña la app desde cero (React + Vite + Tailwind) con tu estética y solo las secciones elegidas</li>`}
        <li>Escribe todas las secciones con el contenido de la Fase 0</li>
        <li>Crea el repositorio en GitHub, publica en GitHub Pages y te entrega la URL final</li>
      </ul>
    </div>
    <div class="nav">
      <button class="btn-back" onclick="go(-1)">← Atrás</button>
      <button class="btn-next" onclick="restart()">📚 Crear otra plataforma</button>
    </div>
  `
];

function cpCwd() {
  const t = document.getElementById('cwdVal').textContent;
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById('cpCwd');
    b.textContent = '✓';
    setTimeout(() => { b.textContent = 'Copiar'; }, 1800);
  });
}

// ═══════════════════════════════ RENDER ═══════════════════════════════
const DOT_LABELS = ['★', '1', '2', '3', '4', '5', '6', '7', '✓'];

function progLabel() {
  if (state.step === 0) return 'Inicio';
  if (state.step === TOTAL - 1) return '¡Listo!';
  return `Paso ${DOT_LABELS[state.step]} de ${DOT_LABELS[TOTAL - 2]}`;
}

function render() {
  const dc = document.getElementById('dots');
  dc.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === state.step ? ' active' : i < state.step ? ' done' : '');
    d.textContent = DOT_LABELS[i];
    d.style.fontSize = i === 0 || i === TOTAL - 1 ? '0.85rem' : '0.72rem';
    if (i < state.step) d.onclick = () => { state.step = i; save(); render(); };
    dc.appendChild(d);
  }
  document.getElementById('progLbl').textContent = progLabel();
  document.getElementById('content').innerHTML = STEPS[state.step]();
  updateNavState();
}

if (resumedFromStorage) {
  document.getElementById('resumeSlot').innerHTML = `<div class="resume-banner">
    <span style="flex:1">📌 Retomaste donde dejaste${state.proyecto.titulo ? ' — «' + state.proyecto.titulo.replace(/</g,'&lt;') + '»' : ''}.</span>
    <button onclick="restart()">Empezar de cero</button>
  </div>`;
}

render();
</script>
</body>
</html>
